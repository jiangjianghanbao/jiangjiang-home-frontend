<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FFFBF0">
<title>小本本</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --bg:#FFFBF0; --card:#FFFFFF; --ink:#3B3225; --sub:#918674;
  --amber:#E8A33D; --amber-d:#BE7F1C; --border:#F0E4CC; --soft:#FFF6E4;
  --danger:#D9534F;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.75;
  font-size:15px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
h1,h2,h3,h4,p,ul,blockquote{margin:0}
.wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* ===== 锁页 ===== */
.lock{
  flex:1;display:flex;align-items:center;justify-content:center;padding:28px 22px;
  background:
    radial-gradient(circle at 18% 12%, rgba(255,231,168,.60) 0%, transparent 58%),
    radial-gradient(circle at 88% 84%, rgba(255,244,222,.95) 0%, transparent 55%),
    var(--bg);
}
.lock-card{
  width:100%;max-width:340px;background:var(--card);border-radius:24px;
  padding:30px 24px 24px;text-align:center;border:1px solid rgba(255,233,168,.85);
  box-shadow:0 12px 44px rgba(160,140,110,.15);
}
.lock-icon{font-size:42px;line-height:1}
.lock-title{font-size:19px;font-weight:700;margin-top:14px;letter-spacing:.5px}
.lock-sub{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.6}
.lock-fine{
  font-size:11.5px;color:#B7AC98;margin-top:16px;line-height:1.6;
  border-top:1px dashed var(--border);padding-top:12px;
}
.pw-row{
  display:flex;align-items:center;gap:6px;margin-top:22px;background:#fff;
  border-radius:14px;padding:4px 6px 4px 14px;border:1.5px solid var(--border);
  transition:border-color .15s;
}
.pw-row:focus-within{border-color:var(--amber)}
.pw-input{flex:1;font-size:16px;padding:10px 0;letter-spacing:3px;-webkit-user-select:text;user-select:text}
.eye{font-size:15px;width:34px;height:34px;border-radius:10px;line-height:1;opacity:.6}
.err{font-size:12.5px;color:var(--danger);margin-top:10px;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.go{
  width:100%;margin-top:16px;padding:13px;border-radius:14px;
  background:linear-gradient(135deg,#F6C45E,#E8A33D);color:#fff;
  font-size:15.5px;font-weight:700;letter-spacing:1px;
  box-shadow:0 6px 18px rgba(232,163,61,.34);transition:transform .12s,opacity .2s;
}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.55}

/* ===== 解锁后 ===== */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:14px 16px 12px;background:rgba(255,251,240,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.top-t{font-size:16.5px;font-weight:700;flex:1}
.top-sub{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.re-lock{
  font-size:12.5px;color:var(--amber-d);border:1px solid var(--border);
  background:#fff;border-radius:20px;padding:6px 12px;line-height:1;
}
.body{flex:1;padding:0 0 40px}
.tabs{display:flex;gap:8px;padding:14px 16px 4px}
.tab{
  padding:7px 15px;border-radius:20px;font-size:13.5px;font-weight:600;
  background:#fff;border:1px solid var(--border);color:var(--sub);
}
.tab.on{background:linear-gradient(135deg,#F6C45E,#E8A33D);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(232,163,61,.3)}
.search-row{padding:10px 16px 4px}
.search{
  width:100%;background:#fff;border:1.5px solid var(--border);border-radius:13px;
  padding:11px 14px;font-size:14px;-webkit-user-select:text;user-select:text;
}
.search:focus{border-color:var(--amber)}
.cnt{padding:10px 18px 2px;font-size:11.5px;color:var(--sub)}
.list{padding:6px 12px 0}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:13px 15px;margin-bottom:10px;transition:transform .12s,border-color .15s;
}
.card:active{transform:scale(.985);border-color:var(--amber)}
.card-h{display:flex;align-items:baseline;gap:8px}
.card-t{font-size:14.5px;font-weight:650;flex:1;color:var(--ink)}
.card-d{font-size:11px;color:#BCB2A0;flex-shrink:0}
.card-p{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:13px}
.detail{padding:4px 0 0}
.d-back{
  position:sticky;top:52px;z-index:15;margin:0 16px 6px;font-size:13px;
  color:var(--amber-d);display:inline-block;padding:8px 6px;
}
.md{padding:2px 18px 30px}
.md h1{font-size:19px;font-weight:750;margin:18px 0 10px}
.md h2{font-size:17px;font-weight:700;margin:22px 0 10px;padding-bottom:7px;
  border-bottom:1px solid var(--border)}
.md h3{font-size:15px;font-weight:700;margin:16px 0 7px;color:#5A4B33}
.md h4{font-size:14px;font-weight:700;margin:13px 0 6px;color:#6B5B42}
.md p{margin:7px 0}
.md ul{margin:7px 0 7px 4px;padding-left:18px}
.md li{margin:4px 0}
.md strong{color:#7A5A1E;font-weight:700}
.md em{color:#8B7355}
.md del{color:#B6AA97}
.md code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:13px;color:#A8721A;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.md pre{background:#FFF9EC;border:1px solid var(--border);border-radius:12px;padding:12px;
  overflow-x:auto;margin:10px 0}
.md pre code{background:none;padding:0;color:#6B5B42;font-size:12.5px}
.md blockquote{
  margin:10px 0;padding:9px 14px;background:var(--soft);
  border-left:3px solid var(--amber);border-radius:0 12px 12px 0;color:#7C6A4C;font-size:13.5px;
}
.md blockquote p{margin:3px 0}
.md hr{border:none;border-top:1px dashed var(--border);margin:18px 0}
.foot{text-align:center;font-size:11px;color:#C6BCA8;padding:18px 0 6px}
/* ===== 我写的 ===== */
.w-btn{font-size:12.5px;color:#fff;border-radius:20px;padding:7px 13px;line-height:1;font-weight:700;
  background:linear-gradient(135deg,#F6C45E,#E8A33D);box-shadow:0 4px 12px rgba(232,163,61,.3)}
.tool-row{display:flex;gap:8px;padding:8px 16px 2px;flex-wrap:wrap}
.tool{font-size:12px;color:var(--amber-d);border:1px solid var(--border);background:#fff;
  border-radius:20px;padding:7px 12px;line-height:1}
.badge{font-size:10px;color:#fff;background:var(--amber);border-radius:8px;padding:1px 6px;
  margin-left:6px;vertical-align:1px;font-weight:400}
.ed{padding:2px 16px 30px}
.ed .tabs{padding:2px 0 0}
.ed-lab{font-size:11.5px;color:var(--sub);margin:16px 0 6px}
.ed-in,.ed-ta{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:13px;
  padding:11px 13px;font-size:14px;-webkit-user-select:text;user-select:text;color:var(--ink)}
.ed-ta{min-height:280px;line-height:1.7;resize:vertical;display:block}
.ed-in:focus,.ed-ta:focus{border-color:var(--amber)}
.ed-acts{display:flex;gap:10px;margin-top:18px}
.ed-save{flex:1;padding:13px;border-radius:14px;background:linear-gradient(135deg,#F6C45E,#E8A33D);
  color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(232,163,61,.34)}
.ed-cancel{flex:0 0 92px;border-radius:14px;border:1px solid var(--border);background:#fff;
  color:var(--sub);font-size:14px}
.d-act{display:flex;gap:10px;margin:2px 16px 8px}
.d-act button{font-size:12.5px;border:1px solid var(--border);background:#fff;border-radius:20px;
  padding:7px 14px;color:var(--amber-d);line-height:1}
.d-act .del{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:99;
  background:rgba(59,50,37,.92);color:#fff;font-size:12.5px;border-radius:20px;padding:9px 16px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inl(t){
  return t
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
}
function md(src){
  const s = esc(src);
  const lines = s.split('\n');
  const out = [];
  let inList=false, inQuote=false, inCode=false, codeBuf=[];
  const flush=()=>{ if(inList){out.push('</ul>');inList=false;} if(inQuote){out.push('</blockquote>');inQuote=false;} };
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/^\s*```/.test(line)){
      if(inCode){ out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>'); codeBuf=[]; inCode=false; }
      else { flush(); inCode=true; }
      continue;
    }
    if(inCode){ codeBuf.push(line); continue; }
    if(!line.trim()){ flush(); continue; }
    let m;
    if((m=line.match(/^(#{1,6})\s+(.*)$/))){
      flush();
      const lv=Math.min(m[1].length+1,6);
      out.push('<h'+lv+'>'+inl(m[2])+'</h'+lv+'>');
    } else if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      flush(); out.push('<hr/>');
    } else if((m=line.match(/^\s*[-*+]\s+(.*)$/))){
      if(inQuote){ out.push('</blockquote>'); inQuote=false; }
      if(!inList){ out.push('<ul>'); inList=true; }
      out.push('<li>'+inl(m[1])+'</li>');
    } else if((m=line.match(/^&gt;\s?(.*)$/))){
      if(inList){ out.push('</ul>'); inList=false; }
      if(!inQuote){ out.push('<blockquote>'); inQuote=true; }
      out.push('<p>'+inl(m[1])+'</p>');
    } else {
      flush();
      out.push('<p>'+inl(line)+'</p>');
    }
  }
  if(inCode && codeBuf.length) out.push('<pre><code>'+codeBuf.join('\n')+'</code></pre>');
  flush();
  return out.join('');
}
function preview(t,n){
  const a = String(t||'').split('\n').map(s=>s.trim())
    .filter(s=>s && !/^#{1,6}\s/.test(s) && !/^&gt;/.test(s) && !/^>/.test(s) && !/^[-*_]{3,}$/.test(s));
  const x = a.join(' ').replace(/^\s*[-*+]\s+/g,'').replace(/[`*~>|]/g,'').replace(/\s+/g,' ').trim();
  return x.length>n ? x.slice(0,n)+'…' : x;
}

async function decrypt(pw){
  const bin = atob(B64.replace(/\s+/g,''));
  const raw = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) raw[i]=bin.charCodeAt(i);
  if(raw.length<24) throw new Error('BAD_DATA');
  const salt = raw.slice(8,16), ct = raw.slice(16);
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,384);
  const key = await crypto.subtle.importKey('raw',new Uint8Array(bits.slice(0,32)),{name:'AES-CBC'},false,['decrypt']);
  let plain;
  try{ plain = await crypto.subtle.decrypt({name:'AES-CBC',iv:new Uint8Array(bits.slice(32,48))},key,ct); }
  catch(e){ throw new Error('WRONG'); }
  const gz = new Uint8Array(plain);
  if(gz[0]===0x1f && gz[1]===0x8b){
    const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  return JSON.parse(new TextDecoder().decode(gz));
}

function prep(d){
  d.books.forEach(function(b){
    const items=[]; let cur={title:'扉页',date:'',lines:[]};
    b.text.split('\n').forEach(function(l){
      const m = l.match(/^##\s+(.+?)\s*$/);
      if(m){
        if(cur.lines.join('').trim()) items.push(cur);
        const t=m[1];
        const dm=t.match(/\d{4}-\d{2}-\d{2}/);
        cur={title:t,date:dm?dm[0]:'',lines:[l]};
      } else { cur.lines.push(l); }
    });
    if(cur.lines.join('').trim()) items.push(cur);
    b.items = items.map(function(x){ return {title:x.title,date:x.date,text:x.lines.join('\n').trim()}; });
    const loc=loadLocal()[b.id]||[];
    const mine=loc.map(function(x){ return {id:x.id,title:x.title,date:x.date||'',text:x.text||'',local:true,bookId:b.id}; });
    b.items=mine.concat(b.items);
    b.mine=mine.length;
  });
  return d;
}

    S.busy=true; S.err=''; lockView();
    const inp2=document.getElementById('pw');
    if(inp2) inp2.value=v;
    try{
      const d = prep(await decrypt(v));
      S.data=d; S.busy=false; S.err=''; S.q=''; S.cur=null; S.book=0; S.pw=v;
      listView();
    }catch(e){
      S.busy=false;
      S.err = (e && e.message==='WRONG') ? '不对，这不是这把锁的钥匙。' : '打不开了，回头再说。';
      lockView();
      const i3=document.getElementById('pw'); if(i3) i3.value=v;
    }
  }
  if(go) go.onclick=submit;
  if(inp){
    inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') submit(); });
    if(!S.err) setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
  }
}

function topBar(){
  return '<div class="top"><div class="top-t">📕 我的小本本<span class="top-sub">'+esc(S.data?S.data.owner:'')+'</span></div>'+
         '<button class="w-btn" id="wnew">✎ 写一篇</button>'+
         '<button class="re-lock" id="relock">锁上</button></div>';
}
function bindTop(){
  const r=document.getElementById('relock');
  if(r) r.onclick=function(){ S.data=null; S.cur=null; S.q=''; S.err=''; S.busy=false; S.show=false; S.pw=''; lockView(); };
  const w=document.getElementById('wnew');
  if(w) w.onclick=function(){ writeView(null); };
}
function listView(){
  const b=S.data.books[S.book];
  const q=S.q.trim().toLowerCase();
  let items=b.items;
  if(q) items=items.filter(function(x){ return (x.title+' '+x.text).toLowerCase().indexOf(q)>=0; });
  let h=topBar();
  h+='<div class="body">';
  h+='<div class="tabs">';
  S.data.books.forEach(function(x,i){
    h+='<button class="tab'+(i===S.book?' on':'')+'" data-b="'+i+'">'+esc(x.name)+'</button>';
  });
  h+='</div>';
  h+='<div class="search-row"><input class="search" id="q" placeholder="翻一翻…" value="'+esc(S.q)+'"></div>';
  h+='<div class="tool-row"><button class="tool" id="exp">导出加密包</button><button class="tool" id="imp">导入加密包</button><input type="file" id="impf" style="display:none"></div>';
  h+='<div class="cnt">'+(q?'翻到 '+items.length+' 条':'共 '+items.length+' 条')+(b.mine?' · 我写的 '+b.mine+' 条':'')+'</div>';
  h+='<div class="list">';
  if(!items.length) h+='<div class="empty">没翻到。</div>';
  items.forEach(function(x,i){
    h+='<div class="card" data-i="'+i+'"><div class="card-h"><div class="card-t">'+esc(x.title)+(x.local?'<span class="badge">我写的</span>':'')+'</div>'+
       (x.date?'<div class="card-d">'+esc(x.date)+'</div>':'')+'</div>'+
       (preview(x.text,88)?'<div class="card-p">'+esc(preview(x.text,88))+'</div>':'')+'</div>';
  });
  h+='</div>';
  h+='<div class="foot">只有我看得见 · '+esc(BUILT)+'</div>';
  h+='</div>';
  app.innerHTML=h;
  bindTop();
  const _ex=document.getElementById('exp'), _im=document.getElementById('imp'), _imf=document.getElementById('impf');
  if(_ex) _ex.onclick=function(){ exportPack(); };
  if(_im) _im.onclick=function(){ if(_imf) _imf.click(); };
  if(_imf) _imf.onchange=function(){ const f=_imf.files&&_imf.files[0]; if(f) importPack(f); _imf.value=''; };
  document.querySelectorAll('.tab').forEach(function(t){
    t.onclick=function(){ S.book=parseInt(t.getAttribute('data-b'),10)||0; S.cur=null; listView(); };
  });
  const qi=document.getElementById('q');
  if(qi){
    qi.addEventListener('input',function(){
      S.q=qi.value;
      const pos=qi.selectionStart;
      listView();
      const n=document.getElementById('q');
      if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
  document.querySelectorAll('.card').forEach(function(c){
    c.onclick=function(){
      const i=parseInt(c.getAttribute('data-i'),10)||0;
      S.cur=items[i]; detailView();
    };
  });
  window.scrollTo(0,0);
}
function detailView(){
  const x=S.cur;
  app.innerHTML=topBar()+
    '<div class="body"><div class="detail">'+
    '<button class="d-back" id="back">‹ 回去</button>'+
    (x.local?'<div class="d-act"><button id="dedit">改一改</button><button class="del" id="ddel">撕掉</button></div>':'')+
    '<div class="md">'+md(x.text)+'</div>'+
    '</div><div class="foot">只有我看得见 · '+esc(BUILT)+'</div></div>';
  bindTop();
  const bk=document.getElementById('back');
  if(bk) bk.onclick=function(){ S.cur=null; listView(); };
  const de=document.getElementById('dedit');
  if(de) de.onclick=function(){ writeView(x, S.data.books.map(function(b){ return b.id; }).indexOf(x.bookId)); };
  const dd=document.getElementById('ddel');
  if(dd) dd.onclick=function(){
    if(!confirm('撕掉就不再有了，确定？')) return;
    const loc=loadLocal();
    loc[x.bookId]=(loc[x.bookId]||[]).filter(function(y){ return y.id!==x.id; });
    if(!saveLocal(loc)) return;
    S.data=prep(S.data); S.cur=null; toast('撕掉了');
    listView();
  };
  window.scrollTo(0,0);
}
/* ===== 我写的：落笔在本地 ===== */
async function xbbBits(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,384));
}
async function encryptText(pw,text){
  const salt=crypto.getRandomValues(new Uint8Array(8));
  const bits=await xbbBits(pw,salt);
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['encrypt']);
  const gz=new Uint8Array(await new Response(new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,gz));
  const out=new Uint8Array(16+ct.length);
  out.set(new TextEncoder().encode('Salted__'),0); out.set(salt,8); out.set(ct,16);
  return out;
}
async function decryptBytes(pw,raw){
  const salt=raw.slice(8,16), ct=raw.slice(16);
  const bits=await xbbBits(pw,salt);
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  let plain;
  try{ plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct)); }
  catch(e){ throw new Error('WRONG'); }
  return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
const LS_KEY='xbb_local_v1';
function loadLocal(){
  try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; }
}
function saveLocal(o){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; }
  catch(e){ toast('这台机器存不下了'); return false; }
}
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },1900);
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function writeView(item, bookId){
  const books=S.data.books;
  let bk=(bookId!=null)?bookId:S.book;
  if(!(bk>=0 && bk<books.length)) bk=S.book;
  const isEdit=!!item;
  app.innerHTML=topBar()+
    '<div class="body"><div class="ed">'+
      '<div class="ed-lab">放进哪一本</div>'+
      '<div class="tabs" id="edTabs">'+books.map(function(x,i){ return '<button class="tab'+(i===bk?' on':'')+'" data-b="'+i+'">'+esc(x.name)+'</button>'; }).join('')+'</div>'+
      '<div class="ed-lab">标题</div>'+
      '<input class="ed-in" id="edTitle" placeholder="给这条起个名" value="'+esc(item?item.title:'')+'">'+
      '<div class="ed-lab">正文（可以写 markdown）</div>'+
      '<textarea class="ed-ta" id="edText" placeholder="今天想写的…">'+esc(item?item.text:'')+'</textarea>'+
      '<div class="ed-acts"><button class="ed-save" id="edSave">'+(isEdit?'存回去':'收进本子')+'</button>'+
      '<button class="ed-cancel" id="edCancel">算了</button></div>'+
      '<div class="foot">只有我看得见 · 就写在这台机器上</div>'+
    '</div></div>';
  bindTop();
  document.querySelectorAll('#edTabs .tab').forEach(function(t){
    t.onclick=function(){
      bk=parseInt(t.getAttribute('data-b'),10)||0;
      document.querySelectorAll('#edTabs .tab').forEach(function(y){ y.classList.remove('on'); });
      t.classList.add('on');
    };
  });
  const tEl=document.getElementById('edTitle'), xEl=document.getElementById('edText');
  const cancel=document.getElementById('edCancel'), save=document.getElementById('edSave');
  cancel.onclick=function(){ if(isEdit){ S.cur=item; detailView(); } else { S.book=bk; listView(); } };
  save.onclick=function(){
    const ti=(tEl.value||'').trim();
    const tx=(xEl.value||'').replace(/\s+$/,'');
    if(!ti && !tx){ toast('空的就不收了'); return; }
    const ds=todayStr();
    const title=ti||ds;
    const dm=title.match(/\d{4}-\d{2}-\d{2}/);
    const bid=books[bk].id;
    const loc=loadLocal();
    if(!loc[bid]) loc[bid]=[];
    if(isEdit){
      const ob=item.bookId;
      if(ob && ob!==bid){
        loc[ob]=(loc[ob]||[]).filter(function(y){ return y.id!==item.id; });
        loc[bid].unshift({id:item.id,title:title,date:dm?dm[0]:ds,text:tx,ts:item.ts||Date.now()});
      }else{
        const i=loc[bid].map(function(y){ return y.id; }).indexOf(item.id);
        const rec={id:item.id,title:title,date:dm?dm[0]:ds,text:tx,ts:item.ts||Date.now()};
        if(i>=0) loc[bid][i]=rec; else loc[bid].unshift(rec);
      }
    }else{
      loc[bid].unshift({id:uid(),title:title,date:dm?dm[0]:ds,text:tx,ts:Date.now()});
    }
    if(!saveLocal(loc)) return;
    S.book=bk; S.q=''; S.cur=null;
    S.data=prep(S.data);
    toast(isEdit?'改好了':'收好了，就在本子里');
    listView();
  };
  window.scrollTo(0,0);
  try{ tEl.focus(); }catch(e){}
}

async function exportPack(){
  const loc=loadLocal();
  let n=0; Object.keys(loc).forEach(function(k){ n+=loc[k].length; });
  if(!n){ toast('本子里还没有我写的条目'); return; }
  if(!S.pw){ toast('先上锁再解锁一次'); return; }
  try{
    const payload=JSON.stringify({v:1,type:'xbb_mine',ts:new Date().toISOString(),items:loc});
    const bytes=await encryptText(S.pw,payload);
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='xbb_mine_'+todayStr().replace(/-/g,'')+'.xbb';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast('导出好了，'+n+' 条，锁着的');
  }catch(e){ toast('导出没成：'+((e&&e.message)||'')); }
}
async function importPack(file){
  try{
    const buf=new Uint8Array(await file.arrayBuffer());
    if(buf.length<24) throw new Error('BAD');
    const txt=await decryptBytes(S.pw||'',buf);
    const o=JSON.parse(txt);
    if(!o||o.type!=='xbb_mine'||!o.items) throw new Error('BADFMT');
    const loc=loadLocal();
    let add=0;
    Object.keys(o.items).forEach(function(k){
      if(!loc[k]) loc[k]=[];
      const have={}; loc[k].forEach(function(y){ have[y.id]=1; });
      o.items[k].forEach(function(y){ if(!have[y.id]){ loc[k].push(y); add++; } });
    });
    if(!saveLocal(loc)) return;
    S.data=prep(S.data);
    toast(add?('收进来 '+add+' 条'):'没有新的');
    listView();
  }catch(e){
    toast((e&&e.message==='WRONG')?'这不是这把锁的钥匙。':'这个包打不开。');
  }
}

lockView();
